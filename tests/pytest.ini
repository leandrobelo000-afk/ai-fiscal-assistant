# pytest configuration
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
markers =
    integration: marca testes que precisam de recursos externos (Tesseract, LM Studio, arquivos)
    slow: marca testes lentos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning